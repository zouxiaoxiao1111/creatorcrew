name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Validate templates (schema + secret scan)
        run: pnpm validate-templates
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  build-without-ee:
    name: Build without ee/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Remove ee/
        run: rm -rf ee
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify the app does not reference ee/
        run: |
          if grep -rIl --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist \
               -E "from ['\"](\.\./)+ee/|require\(['\"](\.\./)+ee/" apps packages; then
            echo "核心代码不能静态引用 ee/"; exit 1
          fi

  migrations:
    name: Migrations on Postgres + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: creatorcrew
          POSTGRES_PASSWORD: creatorcrew
          POSTGRES_DB: creatorcrew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U creatorcrew" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://creatorcrew:creatorcrew@localhost:5432/creatorcrew
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Schema is in sync with migrations
        run: |
          pnpm db:generate
          git diff --exit-code packages/db/drizzle

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
